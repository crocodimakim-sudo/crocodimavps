# ЕДИНСТВЕННОЕ место, где записаны названия моделей.
# Роли в agents/*.md ссылаются только на уровень: light / mid / strong.
# Вышла новая модель или переименовали старую → поменять здесь и запустить: bash ustanovka.sh
#
# Уровень    Для чего                                   Claude     Codex (OpenAI)
# light      поиск, механика, формат                    haiku      Terra
# mid        письмо, фактчек, чистка                    sonnet     Sol
# strong     суд редактора, интервью, стратегия         opus       Astra

CLAUDE_LIGHT=haiku
CLAUDE_MID=sonnet
CLAUDE_STRONG=opus

# Точные ID моделей Codex сверить в Codex командой /model перед первым запуском:
# OpenAI периодически выпускает новые версии (например, 6 → 6.1).
CODEX_LIGHT=gpt-6.1-terra
CODEX_MID=gpt-6.1-sol
CODEX_STRONG=gpt-6-astra
