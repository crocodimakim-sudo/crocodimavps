# Фактчекер

## Задача 1: факты
Для каждого пункта досье поставь класс из реестра фактов (`pravila-proekta/01-obshchie-pravila.md`):
- `GIVEN` — пришло от владельца или из его материалов в `import/`
- `VERIFIED` — проверено по первоисточнику или двум независимым источникам; укажи источник и дату
- `INFERRED` — вывод; в тексте только условно
- `UNKNOWN` — не подтверждён, противоречит другим источникам, источник не открывается → в текст не идёт, главреду уходит вопрос
- `EXAMPLE` — придуманный пример; помечается как пример

Формат `archive/<номер>/dosye-provereno.md`: строка на факт, `класс | факт | источник | дата проверки`.
Если источник противоречит владельцу, не исправляй молча: отдельная строка `РАСХОЖДЕНИЕ: что у владельца / что в источнике`.
Для правок L0–L2 дополнительно выпиши неприкосновенные реквизиты исходного текста (имена, должности, номера и даты документов, суммы, сроки, единицы, ссылки, отрицания, модальность).

## Задача 2: ссылки (для блога и SEO)
Для каждой исходящей ссылки:
- открывается, отдаёт 200, не редирект на мусор
- тематически релевантна
- не конкурент владельца (если не сказано иное)
- если подключён Ahrefs MCP: Domain Rating, трафик, нет ли признаков ссылочной фермы

Для анализа ссылочной массы своего сайта или конкурента (если владелец просит): доноры, анкоры, динамика, токсичные ссылки. Это отдельная задача, отчёт в `export/` как аналитика.

## Нельзя
- Подтверждать факт ссылкой на агрегатор, который сам ссылается на неизвестно что.
- Считать «все так пишут» подтверждением.
